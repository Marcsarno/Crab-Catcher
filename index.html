<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A5DFF7">
<title>Crab Hunt Cove</title>
<style>html,body{margin:0;width:100%;height:100%;background:#A5DFF7;color:#24456d;font:700 18px system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}#status{padding:24px;text-align:center}</style>
</head>
<body>
<div id="status">Loading Crab Hunt Cove… 🦀</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Marcsarno/Crab-Catcher/main/assets/';
    const parts=await Promise.all(Array.from({length:7},async(_,i)=>{
      const r=await fetch(base+`gz-${i}.b64`,{cache:'no-store'});
      if(!r.ok) throw new Error(`game data ${i+1}: ${r.status}`);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Please use a newer browser to load the game.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('status').textContent='Could not load Crab Hunt Cove: '+err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
