<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#74cdf0">
<title>Crab Catcher</title>
<style>html,body{margin:0;width:100%;height:100%;background:#74cdf0;color:#fff;font:700 18px system-ui,sans-serif}body{display:grid;place-items:center}#status{padding:24px;text-align:center}</style>
</head>
<body>
<div id="status">Loading Crab Catcher…</div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/Marcsarno/Crab-Catcher/main/assets/';
    const parts=await Promise.all([0,1,2,3,4].map(async i=>{
      const r=await fetch(base+`game-${i}.b64`,{cache:'no-store'});
      if(!r.ok) throw new Error(`game-${i}: ${r.status}`);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('status').textContent='Could not load Crab Catcher: '+err.message;
  }
})();
</script>
</body>
</html>
